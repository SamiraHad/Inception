services:

  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:1.0
    container_name: mariadb

    env_file:
      - .env

    secrets:
      - db_password
      - db_root_password

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception

    restart: always


  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:1.0
    container_name: wordpress

    env_file:
      - .env

    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

    depends_on:
      - mariadb

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - inception

    restart: always


  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:1.0
    container_name: nginx

    depends_on:
      - wordpress

    ports:
      - "443:443"

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - inception

    restart: always


secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hsamira/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hsamira/data/wordpress

networks:
  inception:
    driver: bridge
